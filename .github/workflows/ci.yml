name: neovault-ci

# CI/CD (spec §3): on every push — flutter analyze + tests + debug/release APK build.
on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (0 issues required)
        run: flutter analyze --fatal-infos

      - name: Unit + widget tests
        run: flutter test --concurrency=1

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neovault-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Release build (signed with debug keys in beta; Play signing after beta)
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neovault-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Firebase App Distribution for 20 beta testers (§2 closed beta)
      - name: Distribute to Firebase App Distribution
        if: github.ref == 'refs/heads/main'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          curl -sL https://firebase.tools | bash
          firebase apps:android:sha1 $ANDROID_APP_ID --output=sha1 2>/dev/null || true
          firebase distribution:groups:add neovault-beta --app $ANDROID_APP_ID \
            --release-notes "Beta build from CI" 2>/dev/null || \
            echo "Configure FIREBASE_TOKEN and ANDROID_APP_ID secrets after flutterfire configure"

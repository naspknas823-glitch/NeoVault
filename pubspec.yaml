name: neovault
description: "NeoVault — gamified savings vault for your gaming setup. Online-only premium UI: prices via Tavily web search."
publish_to: 'none'
version: 0.9.0+9

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management (fixed by spec §3)
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^14.2.7
  # Local DB: Drift + SQLCipher (fixed by spec §3)
  drift: ^2.20.3
  # Direct dep: open.overrideFor (SQLCipher loader) via package:sqlite3/open.dart
  sqlite3: ^2.9.0
  # SQLCipher build of sqlite3 (⛔ §8.3 encryption) — also ships the plain
  # sqlite3 plugin classes, so sqlite3_flutter_libs must NOT be added too.
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.4
  path: ^1.9.0
  # Utils (intl pinned ≥0.20.2: newer Flutter SDKs pin intl via
  # flutter_localizations — 0.19 no longer resolves)
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^10.1.2
  # Charts (neon gradient line charts)
  fl_chart: ^0.69.0
  # Firebase (FlutterFire) — offline-first: app fully works when Firebase is unavailable.
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  quick_actions: ^1.1.0
  home_widget: ^0.9.3
  flutter_local_notifications: ^22.3.0
  flutter_dynamic_icon_plus: ^1.4.1
  geolocator: ^14.0.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/l10n/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

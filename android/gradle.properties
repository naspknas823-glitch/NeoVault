org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP's JdkImageTransform needs jlink: JDK 17 (Temurin) is pinned so builds
# are reproducible even when the host default JAVA_HOME points to JDK 21.
org.gradle.java.home=/home/z/jdk17

org.gradle.daemon=false
org.gradle.parallel=false
